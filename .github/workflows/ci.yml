# ===================================================================
# GITHUB ACTIONS — CI Pipeline
# ===================================================================
# Runs automated tests on every push to main and every pull request
# targeting main.
#
# KEY CONCEPTS:
#   - Workflow: This entire YAML file
#   - Job:      A group of steps that run on the same machine
#   - Step:     A single action
#   - Runner:   The virtual machine that executes the job
# ===================================================================

name: CI — Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npx jest --forceExit --verbose
        env:
          NODE_ENV: test
          PORT: 3001
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          JWT_SECRET: ci-test-secret-key
          OPENAI_API_KEY: sk-test-fake-key
          UPSTASH_REDIS_REST_URL: https://fake-redis.upstash.io
          UPSTASH_REDIS_REST_TOKEN: fake-token
          CLOUDINARY_CLOUD_NAME: test-cloud
          CLOUDINARY_API_KEY: "123456"
          CLOUDINARY_API_SECRET: test-secret
          REDIS_URL: redis://localhost:6379
