# ===================================================================
# DOCKER COMPOSE — Local Development Stack
# ===================================================================
# Docker Compose lets you define and run MULTIPLE containers together.
# Instead of manually starting Postgres, Redis, and your app separately,
# you run ONE command:  docker compose up
#
# KEY CONCEPTS:
#   - Service:  A container definition (like "postgres" or "app")
#   - Volume:   Persistent storage that survives container restarts
#   - Network:  Containers in the same compose file can talk to each
#               other by service name (e.g., "postgres" instead of IP)
#   - depends_on: Controls startup order
# ===================================================================

services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:15-alpine # Official Postgres image (alpine = small)
    restart: unless-stopped # Auto-restart if it crashes
    environment:
      POSTGRES_USER: smartdoc # DB username
      POSTGRES_PASSWORD: smartdoc123 # DB password (change in production!)
      POSTGRES_DB: smartdoc_db # Database name
    ports:
      - "5432:5432" # Map host:container ports
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persist data across restarts
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U smartdoc" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis (for BullMQ job queue) ---
  redis:
    image: redis:7-alpine # Official Redis image
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Smart Doc API ---
  app:
    build: . # Build from our Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000" # Expose the API on localhost:3000
    environment:
      NODE_ENV: development
      PORT: 3000
      # In Docker, services talk to each other by service name.
      # So "postgres" here refers to the postgres container above.
      DATABASE_URL: postgresql://smartdoc:smartdoc123@postgres:5432/smartdoc_db
      REDIS_URL: redis://redis:6379
      # These need to be set — either here or in a .env file
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      postgres:
        condition: service_healthy # Wait for Postgres to be ready
      redis:
        condition: service_healthy # Wait for Redis to be ready

# Named volumes — Docker manages these for you.
# Data persists even if you `docker compose down`.
# To wipe data completely: `docker compose down -v`
volumes:
  postgres_data:
  redis_data:
